# Production / pilot stack (host-agnostic; ADR-0011, ADR-0012, ADR-0013).
#
# Two env files (BR wave 1.6 N2), both chmod 600, never committed:
#   .env.app       (from app.env.example)      -> api, worker; also the only --env-file used for
#                                                 ${...} interpolation below (no DB admin secrets)
#   .env.db-admin  (from db-admin.env.example) -> db, db-roles and migrate ONLY
#
#   docker compose --env-file .env.app -f docker-compose.prod.yml ...
#
# scripts/deploy.sh wraps the whole sequence (preflight -> build api / pull db by digest ->
# db/redis -> db-roles -> checks -> one-shot migrate -> db-roles -> api/worker/caddy -> gates).
# Migrations NEVER run on api start/restart.
#
# !!! Data-directory warning (ADR-0013, K4 risk) !!!
# The database volume is `pgdata_pg16_postgis`, deliberately NOT the legacy
# `pgdata` volume of the old postgres:16-alpine service. Never point this
# PostGIS (glibc) image at an alpine (musl) data directory: text indexes break
# silently. Move data with docs/ops/POSTGRES_POSTGIS_MIGRATION.md (dump/restore).
#
# Database roles (decision 36): POSTGRES_USER is the bootstrap superuser. pg_hba rejects it
# over TCP; it is reachable only through the local socket, which is shared with the
# db-roles job (and `docker compose exec db` for backups/emergencies). The migrate job
# connects as the owner role; api and worker as the NOSUPERUSER app role.
#
# The db image is prebuilt from docker/postgis/Dockerfile, pushed once to the private
# registry in Uzbekistan and pulled here by digest (Q51); it is never built on the server.
# Nothing publishes Postgres or Redis. Only Caddy publishes 80/443.
# Resource limits are starting values for a 2-4 vCPU / 4-8 GB host (spec §19.1);
# tune them with docs/ops/UZ_HOSTING_RUNBOOK.md §6.1.

name: elchi

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# api, worker and the one-shot jobs run the same image built from this commit.
x-app: &app
  image: ${ELCHI_IMAGE:-elchi-api:local}
  env_file: ${ELCHI_APP_ENV_FILE:-.env.app}
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    # PostgreSQL 16.15 + PostGIS 3.5.3, Debian 13 trixie. Required: <registry>/elchi-postgis@sha256:...
    # (scripts/deploy.sh refuses a tag without digest in production).
    image: ${ELCHI_POSTGIS_IMAGE:?set ELCHI_POSTGIS_IMAGE to the registry digest of the PostGIS image (Q51)}
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-2g}
          cpus: "${PG_CPUS:-2}"
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from the db-admin env file.
    env_file: ${ELCHI_DB_ADMIN_ENV_FILE:-.env.db-admin}
    environment:
      # Collation decision (docs/ops/POSTGRES_POSTGIS_MIGRATION.md §3).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C.UTF-8 --data-checksums"
      TZ: UTC
    # Before the server starts: WAL archive dir owned by postgres, and a pg_hba that
    # allows the bootstrap superuser only through the local socket (BR wave 1.6 N2).
    entrypoint:
      - sh
      - -c
      - |
        set -e
        install -d -o postgres -g postgres -m 700 /wal-archive
        umask 077
        cat > /etc/elchi-pg_hba.conf <<EOF
        # generated by docker-compose.prod.yml at container start
        local   all          all                      trust
        local   replication  all                      trust
        host    all          "$${POSTGRES_USER}"      all   reject
        host    replication  all                      all   reject
        host    all          all                      all   scram-sha-256
        EOF
        chown postgres:postgres /etc/elchi-pg_hba.conf
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - hba_file=/etc/elchi-pg_hba.conf
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-100}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      # PITR is NOT allowed in production until WAL encryption exists (decision 35):
      # scripts/deploy.sh refuses PG_ARCHIVE_MODE=on for ELCHI_ENVIRONMENT=production, no override.
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - archive_timeout=${PG_ARCHIVE_TIMEOUT:-300}
    volumes:
      - pgdata_pg16_postgis:/var/lib/postgresql/data
      - pgwal_archive:/wal-archive
      # Local socket, shared read-write only with the db-roles job.
      - pgsocket:/var/run/postgresql
      # Empty on purpose: no image init scripts; roles and extensions come from the
      # db-roles job, schema from migrations.
      - type: tmpfs
        target: /docker-entrypoint-initdb.d
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  redis:
    # Non-durable by design (ADR-0012): cache, pub/sub fan-out, rate limits.
    image: redis:7.4.11@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.5"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.app (hex, e.g. openssl rand -hex 32)}
    # Password in a 0600 config file, not on the command line. volatile-lru (BR #16).
    entrypoint:
      - sh
      - -c
      - |
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf
        chown redis:redis /tmp/redis-auth.conf
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf --protected-mode yes --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    tmpfs:
      - /tmp:size=1m
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: roles, extensions, ownership, grants (idempotent; scripts/deploy.sh runs it
  # before and after migrations). Superuser via the local socket only.
  db-roles:
    <<: *app
    command: ["python", "scripts/db_roles.py"]
    restart: "no"
    profiles: ["ops"]
    env_file: ${ELCHI_DB_ADMIN_ENV_FILE:-.env.db-admin}
    volumes:
      - pgsocket:/var/run/postgresql
    healthcheck:
      disable: true

  # One-shot: `docker compose ... run --rm migrate` (scripts/deploy.sh), as the owner role.
  # Also used for owner-role CLIs: `run --rm migrate python -m app.modules.platform.environment ...`.
  migrate:
    <<: *app
    env_file:
      - ${ELCHI_APP_ENV_FILE:-.env.app}
      - ${ELCHI_DB_ADMIN_ENV_FILE:-.env.db-admin}
    # Point the app settings at the owner role for this job only (alembic/env.py also prefers
    # ELCHI_MIGRATION_DATABASE_URL once A0a's change lands).
    entrypoint: ["sh", "-c", "export ELCHI_DATABASE_URL=\"$$ELCHI_MIGRATION_DATABASE_URL\"; exec \"$$@\"", "--"]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles: ["ops"]
    healthcheck:
      disable: true

  api:
    <<: *app
    build: .
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
          cpus: "${API_CPUS:-1.5}"
    volumes:
      # Private storage (H0): uploads are never served statically; downloads go
      # through signed URLs from GET /api/v1/files/<key>. Must outlive the container.
      - uploads:/app/storage/uploads
    expose:
      - "8000"
    networks: [backend, edge]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
        required: false

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-512m}
          cpus: "${WORKER_CPUS:-0.5}"
    environment:
      ELCHI_WORKER_HEARTBEAT_FILE: /tmp/elchi-worker.heartbeat
      # Scheduled jobs (wave 2.1; per-job advisory lock, so replicas never double-run a job).
      ELCHI_WORKER_EXPIRY_INTERVAL_SECONDS: ${ELCHI_WORKER_EXPIRY_INTERVAL_SECONDS:-60}
      ELCHI_WORKER_SIGNAL_INTERVAL_SECONDS: ${ELCHI_WORKER_SIGNAL_INTERVAL_SECONDS:-300}
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck", "--max-age", "60"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    logging: *logging
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    environment:
      ELCHI_DOMAIN: ${ELCHI_DOMAIN:-api.elchigo.uz}
      # Space-separated monitoring CIDRs allowed to read /health/ready (decision 33).
      # Empty/unset -> 0.0.0.0/32, which matches no peer: readiness denied to everyone.
      ELCHI_MONITORING_CIDRS: ${ELCHI_MONITORING_CIDRS:-0.0.0.0/32}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      - api
    # Admin endpoint answers once the config is loaded (BR wave 1.6 N5: `up -d --wait caddy`).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

networks:
  backend:
    internal: true
  edge: {}
  egress: {}

volumes:
  pgdata_pg16_postgis:
  pgwal_archive:
  pgsocket:
  uploads:
  caddy_data:
  caddy_config:
